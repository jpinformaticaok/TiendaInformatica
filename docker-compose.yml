name: tienda-informatica

services:
  # ---------------------------------------------------------------
  # PostgreSQL en su propio contenedor, con volumen persistente.
  # ---------------------------------------------------------------
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tiendainformatica}
      POSTGRES_USER: ${POSTGRES_USER:-tienda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en el archivo .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  # ---------------------------------------------------------------
  # API .NET. Solo se publica al host el puerto de la API;
  # la base de datos queda accesible únicamente dentro de la red interna.
  # ---------------------------------------------------------------
  api:
    build:
      context: .
    image: tienda-informatica-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 5000
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-tiendainformatica};Username=${POSTGRES_USER:-tienda};Password=${POSTGRES_PASSWORD}"
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-}
    ports:
      - "${API_PORT:-8080}:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
